<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>sebthemes — Try dark Omarchy themes live</title>
  <meta name="description" content="Try Seb's dark themes for Omarchy live on a mock Hyprland desktop, switch wallpapers, inspect palettes, and copy the install line.">
  <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="/*__INITIAL_FAVICON__*/">
  <style>
/*__STYLES__*/
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
            <rect x="2.5" y="2.5" width="19" height="19" stroke="currentColor" stroke-width="2" />
            <rect x="7" y="7" width="10" height="4" fill="currentColor" opacity="0.9" />
            <rect x="7" y="13" width="4.5" height="4" fill="currentColor" opacity="0.55" />
            <rect x="13" y="13" width="4" height="4" fill="currentColor" opacity="0.35" />
          </svg>
        </span>
        <span class="brand-title">sebthemes</span>
        <span class="brand-sep" aria-hidden="true">/</span>
        <span class="brand-sub">Omarchy</span>
        <span class="brand-counter" id="theme-counter">__INITIAL_COUNTER__</span>
      </div>

      <div class="topbar-actions">
        <div class="install-bar" role="region" aria-label="Install command">
          <div class="install-modes" role="tablist" aria-label="Install mode">
            <button type="button" class="mode-btn is-active" data-install-mode="single" role="tab" aria-selected="true">This theme</button>
            <button type="button" class="mode-btn" data-install-mode="all" data-all-count role="tab" aria-selected="false">All __THEME_COUNT__</button>
            <button type="button" class="mode-btn" data-install-mode="clone" role="tab" aria-selected="false">Clone</button>
          </div>
          <code class="install-cmd" id="install-cmd" title="Click to copy"></code>
          <button type="button" class="copy-btn" id="copy-install-btn">
            <svg class="icon-copy" viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true">
              <rect x="5.5" y="5.5" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.4" />
              <path d="M10.5 5.5V3.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2" stroke="currentColor" stroke-width="1.4" />
            </svg>
            <svg class="icon-check" viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true">
              <path d="M3.2 8.4 6.5 11.7 13 4.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" />
            </svg>
            <span id="copy-install-label">Copy</span>
          </button>
        </div>

        <div class="nav-arrows">
          <button type="button" class="icon-btn" id="prev-theme-btn" aria-label="Previous theme" title="Previous theme (Left arrow)">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
              <path d="M9.8 3.5 5.3 8l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="next-theme-btn" aria-label="Next theme" title="Next theme (Right arrow)">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
              <path d="M6.2 3.5 10.7 8l-4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" />
            </svg>
          </button>
        </div>

        <a class="repo-link" href="https://github.com/ikkeseb/sebthemes" target="_blank" rel="noopener" aria-label="ikkeseb/sebthemes on GitHub" title="GitHub">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
          </svg>
        </a>
      </div>
    </header>

    <main class="stage-wrap">
      <section class="desktop-frame" id="desktop-frame" aria-label="Mock Omarchy desktop preview" data-workspace="1" data-focused="terminal">
        <div class="wallpaper-stack" aria-hidden="true">
          <img id="wallpaper-a" class="wallpaper-img is-visible" alt="" decoding="async">
          <img id="wallpaper-b" class="wallpaper-img" alt="" decoding="async">
        </div>

        <div class="waybar" role="toolbar" aria-label="Omarchy bar">
          <div class="waybar-left">
            <span class="omarchy-glyph" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="12" height="12" fill="none">
                <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.5" />
                <circle cx="8" cy="8" r="2" fill="currentColor" />
              </svg>
            </span>
            <nav class="workspaces" aria-label="Desktop workspaces">
              <button type="button" class="ws-btn is-active" data-ws="1" title="Desktop showcase (1)">
                <span class="ws-num">1</span><span class="ws-label-desktop">desk</span><span class="ws-label-mobile">Term</span>
              </button>
              <button type="button" class="ws-btn" data-ws="2" title="Full tiled workspace (2)">
                <span class="ws-num">2</span><span class="ws-label-desktop">tiled</span><span class="ws-label-mobile">Code</span>
              </button>
              <button type="button" class="ws-btn" data-ws="3" title="Omarchy theme menu (3)">
                <span class="ws-num">3</span><span class="ws-label-desktop">menu</span><span class="ws-label-mobile">Menu</span>
              </button>
              <button type="button" class="ws-btn" data-ws="4" title="Wallpaper only (4)">
                <span class="ws-num">4</span><span class="ws-label-desktop">art</span><span class="ws-label-mobile">Art</span>
              </button>
            </nav>
          </div>

          <div class="waybar-center">
            <span id="waybar-clock">Thu 26 Nov 09:42</span>
            <span class="waybar-sep" aria-hidden="true">·</span>
            <span class="waybar-theme" id="waybar-theme">__INITIAL_SLUG__</span>
          </div>

          <div class="waybar-right" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none">
              <rect x="2.5" y="3.5" width="11" height="9" stroke="currentColor" stroke-width="1.3" />
              <path d="M5 7.5h6M5 10h4" stroke="currentColor" stroke-width="1.2" />
            </svg>
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none">
              <path d="M2.2 6.2a8.2 8.2 0 0 1 11.6 0M4.5 8.8a5 5 0 0 1 7 0M6.8 11.4a1.8 1.8 0 0 1 2.4 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none">
              <path d="M2.5 6v4h3l3.5 3V3L5.5 6h-3ZM11.8 5.5a3.5 3.5 0 0 1 0 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="tray-batt">94%</span>
          </div>
        </div>

        <div class="desktop-canvas">
          <!-- Workspaces 1 (Airy Desk) & 2 (Full Hyprland Tiled) -->
          <div class="hypr-grid" id="hypr-grid">
            <div class="hypr-win is-focused" data-win="terminal" tabindex="0" role="button" aria-label="Focus terminal window">
              <span class="hypr-border hypr-border-a is-visible" aria-hidden="true"></span>
              <span class="hypr-border hypr-border-b" aria-hidden="true"></span>
              <div class="hypr-win-inner win-terminal">
                <div class="term-body" id="term-body"></div>
              </div>
            </div>

            <div class="hypr-right-col">
              <div class="hypr-win" data-win="editor" tabindex="0" role="button" aria-label="Focus Neovim window">
                <span class="hypr-border hypr-border-a is-visible" aria-hidden="true"></span>
                <span class="hypr-border hypr-border-b" aria-hidden="true"></span>
                <div class="hypr-win-inner win-editor">
                  <div class="nvim-code" id="nvim-code"></div>
                  <div class="nvim-statusline" id="nvim-statusline"></div>
                </div>
              </div>

              <div class="hypr-win" data-win="btop" tabindex="0" role="button" aria-label="Focus btop window">
                <span class="hypr-border hypr-border-a is-visible" aria-hidden="true"></span>
                <span class="hypr-border hypr-border-b" aria-hidden="true"></span>
                <div class="hypr-win-inner win-btop" id="btop-body"></div>
              </div>
            </div>
          </div>

          <!-- Workspace 3: Authentic Omarchy shell.toml / Walker Theme Menu -->
          <div class="omarchy-menu-layer" id="omarchy-menu-layer" aria-hidden="true">
            <div class="hypr-win is-focused menu-window" data-win="menu">
              <span class="hypr-border hypr-border-a is-visible" aria-hidden="true"></span>
              <span class="hypr-border hypr-border-b" aria-hidden="true"></span>
              <div class="hypr-win-inner menu-inner">
                <div class="menu-search">
                  <span class="menu-prompt" aria-hidden="true">❯</span>
                  <span class="menu-crumb">Appearance <span class="menu-sep">›</span> Theme</span>
                  <span class="menu-hint" id="menu-count">__THEME_COUNT__ themes</span>
                </div>
                <div class="menu-list" id="omarchy-menu-list" role="listbox" aria-label="Omarchy theme switcher"></div>
              </div>
            </div>
          </div>

          <!-- Workspace 4: Pure wallpaper label -->
          <div class="wallpaper-only-badge" id="wallpaper-only-badge" aria-hidden="true">
            <span id="wp-badge-file"></span>
            <span class="wp-badge-sep">·</span>
            <span id="wp-badge-index"></span>
          </div>
        </div>
      </section>

      <section class="meta-strip" aria-label="Active theme details and palette">
        <div class="meta-identity">
          <div class="meta-title-row">
            <h1 class="theme-name" id="theme-name">__INITIAL_NAME__</h1>
            <div class="wp-switcher" id="wp-switcher" role="group" aria-label="Theme wallpapers"></div>
          </div>
          <p class="theme-tagline" id="theme-tagline"></p>
        </div>

        <div class="palette-box">
          <div class="palette-readout" id="palette-readout" aria-live="polite"></div>
          <div class="palette-swatches" id="palette-swatches" role="list" aria-label="Theme color palette"></div>
        </div>
      </section>

      <section class="rail-section" aria-label="Choose a theme">
        <div class="theme-rail" id="theme-rail" role="listbox" aria-label="sebthemes themes"></div>
      </section>

      <!-- Mobile-only install panel (desktop keeps it compact in the top bar) -->
      <section class="mobile-install" aria-label="Install command">
        <div class="mobile-install-head">
          <div class="install-modes" role="tablist" aria-label="Install mode mobile">
            <button type="button" class="mode-btn is-active" data-install-mode="single" role="tab" aria-selected="true">This theme</button>
            <button type="button" class="mode-btn" data-install-mode="all" data-all-count role="tab" aria-selected="false">All __THEME_COUNT__</button>
            <button type="button" class="mode-btn" data-install-mode="clone" role="tab" aria-selected="false">Clone</button>
          </div>
        </div>
        <code class="mobile-install-cmd" id="mobile-install-cmd"></code>
        <button type="button" class="copy-btn mobile-copy-btn" id="mobile-copy-btn">
          <svg class="icon-copy" viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
            <rect x="5.5" y="5.5" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.4" />
            <path d="M10.5 5.5V3.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2" stroke="currentColor" stroke-width="1.4" />
          </svg>
          <svg class="icon-check" viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
            <path d="M3.2 8.4 6.5 11.7 13 4.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" />
          </svg>
          <span id="mobile-copy-label">Copy install command</span>
        </button>
      </section>
    </main>
  </div>

  <script>
/*__DATA__*/
  </script>
  <script>
/*__SCRIPT__*/
  </script>
</body>
</html>
