# Seb Glacier: an original Omarchy theme made for Seb.
# Cool. Blue-black night, ice-blue accent, crisp cool whites.
# Contrast on background: body text >= 7:1, every ANSI colour and muted >= 4.5:1.

mode = "dark"

# Surfaces
background = "#101318"
dark_background = "#0c0e12"
darker_background = "#08090c"
lighter_background = "#1a1e26"
selection = "#263142"

# Text
foreground = "#d6dee9"
light_foreground = "#b4bfce"
bright_foreground = "#f3f7fc"
dark_foreground = "#748093"
muted = "#7f8a9c"

# Accent and ANSI colours (black is the background, bright black is muted)
accent = "#8ccfff"
red = "#f2727f"
yellow = "#e9d07c"
orange = "#f4a37c"
green = "#7fd8a6"
cyan = "#67d3df"
blue = "#72a9f6"
magenta = "#b59df6"
brown = "#6e5142"

bright_red = "#ff98a3"
bright_yellow = "#f6e3a3"
bright_green = "#a5ebc3"
bright_cyan = "#9ce7f0"
bright_blue = "#9cc5ff"
bright_magenta = "#cfbbff"

# Window borders: the accent when active, a quiet tint of the surface when not.
hyprland_inactive_border = "rgba(2a3242aa)"
